  <rect x="400" y="80" width="140" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="470" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5e20">payment-svc</text>
  <text x="470" y="128" text-anchor="middle" font-size="11" fill="#444">TX commit</text>
