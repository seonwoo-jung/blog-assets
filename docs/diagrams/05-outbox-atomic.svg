<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr-ob" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#444"/>
    </marker>
  </defs>
  <rect x="40" y="30" width="600" height="170" rx="12" fill="#fff" stroke="#1976d2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">단일 DB 트랜잭션 (원자적 커밋)</text>
  <rect x="80" y="85" width="240" height="95" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="200" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">도메인 테이블</text>
  <text x="200" y="138" text-anchor="middle" font-size="12" fill="#2e7d32">Payment.complete()</text>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#555">상태 변경</text>
  <rect x="360" y="85" width="240" height="95" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="480" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#311b92">outbox 테이블</text>
  <text x="480" y="138" text-anchor="middle" font-size="12" fill="#4527a0">INSERT(이벤트 의도)</text>
  <text x="480" y="160" text-anchor="middle" font-size="11" fill="#555">status = PENDING</text>
  <text x="340" y="220" text-anchor="middle" font-size="12" fill="#444" font-weight="600">두 INSERT/UPDATE는 같이 커밋되거나 같이 롤백된다</text>
  <line x1="340" y1="232" x2="340" y2="275" stroke="#444" stroke-width="1.5" marker-end="url(#arr-ob)"/>
  <text x="365" y="258" font-size="11" fill="#666">별도 publisher가 폴링</text>
  <rect x="240" y="280" width="200" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="340" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#bf360c">후속 서비스로 전달</text>
  <text x="340" y="348" text-anchor="middle" font-size="11" fill="#555">"DB는 됐는데 후속 처리는 못 보낸" 상황이 사라진다</text>
</svg>
