<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="usersGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="domGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="legacyDbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Client -->
  <g transform="translate(50,240)">
    <circle cx="40" cy="20" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <path d="M10,70 Q40,40 70,70 L70,80 L10,80 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <text x="40" y="105" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">Client</text>
  </g>

  <!-- Django Monolith big box -->
  <g filter="url(#softShadow)">
    <rect x="220" y="80" width="440" height="400" rx="20" fill="url(#monoGrad)" stroke="#9ca3af" stroke-width="2"/>
  </g>
  <text x="440" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">Django Monolith</text>
  <text x="440" y="142" text-anchor="middle" font-size="12" fill="#6b7280">legacy-backend-service</text>

  <!-- users domain (highlighted) -->
  <rect x="260" y="180" width="160" height="80" rx="12" fill="url(#usersGrad)" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">users</text>
  <text x="340" y="234" text-anchor="middle" font-size="11" fill="#6d28d9">members domain</text>

  <!-- other domains -->
  <rect x="460" y="180" width="160" height="50" rx="10" fill="url(#domGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">orders</text>

  <rect x="460" y="245" width="160" height="50" rx="10" fill="url(#domGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">products</text>

  <rect x="260" y="290" width="160" height="50" rx="10" fill="url(#domGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="321" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">payments</text>

  <rect x="260" y="360" width="360" height="50" rx="10" fill="url(#domGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="391" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">other domains . . .</text>

  <!-- Red dashed arrows: orders/products -> users (direct JOIN) -->
  <path d="M460,205 C 440,205 430,220 420,220" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <path d="M460,270 C 440,270 430,250 420,245" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <path d="M340,290 L340,260" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>

  <!-- annotation -->
  <rect x="240" y="430" width="400" height="36" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="440" y="453" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">⚠ other domains JOIN directly on the users table</text>

  <!-- Legacy DB cylinder -->
  <g filter="url(#softShadow)" transform="translate(720,200)">
    <ellipse cx="80" cy="14" rx="60" ry="14" fill="url(#legacyDbGrad)" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M20,14 L20,156 Q20,170 80,170 Q140,170 140,156 L140,14" fill="url(#legacyDbGrad)" stroke="#ea580c" stroke-width="1.5"/>
    <ellipse cx="80" cy="14" rx="60" ry="14" fill="none" stroke="#ea580c" stroke-width="1.5"/>
    <text x="80" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Legacy DB</text>
    <text x="80" y="104" text-anchor="middle" font-size="11" fill="#c2410c">PostgreSQL</text>
    <text x="80" y="128" text-anchor="middle" font-size="10" fill="#9a3412">all domains</text>
    <text x="80" y="143" text-anchor="middle" font-size="10" fill="#9a3412">share this DB</text>
  </g>

  <!-- Client -> Monolith -->
  <path d="M128,280 L220,280" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="174" y="270" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">HTTP</text>

  <!-- Monolith -> Legacy DB -->
  <path d="M660,280 L720,260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
