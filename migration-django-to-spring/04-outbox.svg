<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="laneBL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="laneAuthDB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="laneWorker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="laneDispatcher" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="laneLegacyDB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#ffffff"/>

  <text x="490" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Transactional Outbox — One-way Sync from Auth DB → Legacy DB</text>

  <!-- Lanes (participants) -->
  <g filter="url(#softShadow)">
    <rect x="60"  y="70" width="140" height="44" rx="10" fill="url(#laneBL)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="240" y="70" width="140" height="44" rx="10" fill="url(#laneAuthDB)" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="420" y="70" width="160" height="44" rx="10" fill="url(#laneWorker)" stroke="#059669" stroke-width="1.5"/>
    <rect x="620" y="70" width="140" height="44" rx="10" fill="url(#laneDispatcher)" stroke="#d97706" stroke-width="1.5"/>
    <rect x="800" y="70" width="140" height="44" rx="10" fill="url(#laneLegacyDB)" stroke="#ea580c" stroke-width="1.5"/>
  </g>
  <text x="130" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Business Logic</text>
  <text x="310" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Auth DB</text>
  <text x="500" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">OutboxWorker</text>
  <text x="500" y="106" text-anchor="middle" font-size="10" fill="#047857">500ms poll</text>
  <text x="690" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Dispatcher</text>
  <text x="870" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Legacy DB</text>

  <!-- Lifelines (dashed vertical) -->
  <line x1="130" y1="114" x2="130" y2="600" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="310" y1="114" x2="310" y2="600" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="500" y1="114" x2="500" y2="600" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="690" y1="114" x2="690" y2="600" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="870" y1="114" x2="870" y2="600" stroke="#cbd5e1" stroke-dasharray="3 4"/>

  <!-- Step 1: BL -> Auth DB (save + outbox PENDING) -->
  <path d="M130,150 L308,150" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowDark)"/>
  <text x="220" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">① save Member + OutboxEvent (PENDING)</text>
  <rect x="240" y="160" width="140" height="22" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="310" y="175" text-anchor="middle" font-size="10" fill="#854d0e" font-weight="600">same transaction</text>

  <!-- Step 2: Worker -> Auth DB (FOR UPDATE SKIP LOCKED) -->
  <path d="M500,220 L312,220" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowDark)"/>
  <text x="406" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">② FOR UPDATE SKIP LOCKED</text>

  <!-- Step 3: Auth DB -> Worker (claim) -->
  <path d="M310,250 L498,250" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBack)"/>
  <text x="404" y="242" text-anchor="middle" font-size="12" fill="#4b5563">claim PENDING event</text>

  <!-- Step 4: Worker -> Dispatcher (dispatch by eventType) -->
  <path d="M500,300 L688,300" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowDark)"/>
  <text x="594" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">③ dispatch by eventType</text>
  <text x="594" y="312" text-anchor="middle" font-size="10" fill="#475569">(OAUTH_JOIN, WITHDRAW, ...)</text>

  <!-- Step 5: Dispatcher -> Legacy DB -->
  <path d="M690,360 L868,360" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowDark)"/>
  <text x="779" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">④ legacyTransactionManager tx</text>

  <!-- Step 6: Legacy DB -> Dispatcher (OK) -->
  <path d="M870,390 L692,390" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowBack)"/>
  <text x="781" y="382" text-anchor="middle" font-size="12" fill="#4b5563">OK</text>

  <!-- Step 7: Dispatcher -> Auth DB (mark SUCCESS) -->
  <path d="M690,440 L312,440" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowDark)"/>
  <text x="500" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">⑤ mark SUCCESS</text>

  <!-- Failure note -->
  <rect x="240" y="500" width="600" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="540" y="525" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">On failure</text>
  <text x="540" y="545" text-anchor="middle" font-size="12" fill="#7f1d1d">REQUIRES_NEW isolation per event  ·  up to 3 retries  ·  then FAILED</text>
  <text x="540" y="565" text-anchor="middle" font-size="11" fill="#991b1b">events are idempotent — re-processing yields the same Legacy DB state</text>
</svg>
