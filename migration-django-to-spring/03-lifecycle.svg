<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="activeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="withdrawnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef2f2"/>
      <stop offset="1" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="newGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#ffffff"/>

  <text x="450" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Member Lifecycle (Soft Delete)</text>

  <!-- Start dot -->
  <circle cx="80" cy="240" r="14" fill="#0f172a"/>

  <!-- ACTIVE -->
  <g filter="url(#softShadow)">
    <rect x="180" y="200" width="180" height="80" rx="40" fill="url(#activeGrad)" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="270" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">ACTIVE</text>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#047857">MemberStatus.ACTIVE</text>

  <!-- WITHDRAWN -->
  <g filter="url(#softShadow)">
    <rect x="450" y="200" width="200" height="80" rx="40" fill="url(#withdrawnGrad)" stroke="#dc2626" stroke-width="2.5"/>
  </g>
  <text x="550" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">WITHDRAWN</text>
  <text x="550" y="256" text-anchor="middle" font-size="11" fill="#dc2626">deletedAt = now (soft delete)</text>

  <!-- End dot (kept) -->
  <circle cx="780" cy="160" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <circle cx="780" cy="160" r="6" fill="#0f172a"/>
  <text x="780" y="135" text-anchor="middle" font-size="11" fill="#475569">kept (no restore)</text>

  <!-- ACTIVE_NEW -->
  <g filter="url(#softShadow)">
    <rect x="350" y="360" width="220" height="80" rx="40" fill="url(#newGrad)" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="460" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">ACTIVE (new Member)</text>
  <text x="460" y="416" text-anchor="middle" font-size="11" fill="#2563eb">re-signup → fresh row</text>

  <!-- Arrows -->
  <!-- start -> ACTIVE -->
  <path d="M94,240 L180,240" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="137" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">join()</text>

  <!-- ACTIVE -> WITHDRAWN -->
  <path d="M360,240 L450,240" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="405" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">withdraw()</text>

  <!-- WITHDRAWN -> end (kept) -->
  <path d="M650,220 C 720,200 750,180 770,168" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>

  <!-- WITHDRAWN -> ACTIVE_NEW (re-signup) -->
  <path d="M550,280 C 550,330 500,350 480,360" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="595" y="305" width="200" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="695" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">re-signup with</text>
  <text x="695" y="342" text-anchor="middle" font-size="12" fill="#2563eb">same email / phone</text>

  <!-- legend -->
  <g transform="translate(60,420)">
    <rect width="14" height="14" fill="#a7f3d0" stroke="#059669"/>
    <text x="22" y="12" font-size="11" fill="#065f46">ACTIVE</text>
    <rect x="100" width="14" height="14" fill="#fecaca" stroke="#dc2626"/>
    <text x="122" y="12" font-size="11" fill="#991b1b">WITHDRAWN (soft-deleted, kept)</text>
    <rect x="350" width="14" height="14" fill="#bfdbfe" stroke="#1d4ed8"/>
    <text x="372" y="12" font-size="11" fill="#1e3a8a">ACTIVE (new Member after re-signup)</text>
  </g>
</svg>
